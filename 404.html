<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Страница не найдена — TLNT</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{--accent:#c8a878;background:#fbf8f3;color:#4a443d;font-family:'Nunito Sans',sans-serif;
    min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
  a{text-decoration:none;color:inherit}
  .logo{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;letter-spacing:.18em;color:#3f3a33;padding:22px 28px}
  .logo b{color:var(--accent)}
  main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px 22px 70px;
    background:radial-gradient(120% 70% at 50% 0%,#f6e3df 0%,#f8eee6 34%,#fbf8f3 66%)}
  .box{max-width:520px}
  .emblem{position:relative;width:150px;height:150px;margin:0 auto 26px}
  .emblem .circle{position:absolute;inset:0;border-radius:50%;background:#fff;box-shadow:0 16px 44px rgba(150,120,90,.12);border:1px solid #f0e6d8}
  .emblem .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'Cormorant Garamond',serif;font-size:62px;font-weight:600;color:var(--accent)}
  .emblem .sp{position:absolute;font-size:22px;color:#e8c6bf}
  .emblem .s1{top:-4px;right:14px}.emblem .s2{bottom:6px;left:-2px;font-size:16px;color:#c3d4c1}
  h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(30px,5vw,44px);color:#3f3a33;
    line-height:1.12;margin-bottom:14px;text-wrap:balance}
  h1 em{font-style:italic;color:var(--accent)}
  p{color:#7c7468;font-size:17px;line-height:1.6;max-width:420px;margin:0 auto 30px}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;font-weight:700;
    font-size:16px;padding:14px 28px;border-radius:100px;box-shadow:0 10px 24px rgba(200,168,120,.28)}
  .btn:hover{background:#bb9968}
  .btn.soft{background:#fff;color:#4a443d;border:1.5px solid #e6dccc;box-shadow:none}
  .btn.soft:hover{border-color:var(--accent)}
  .en{margin-top:26px;font-size:14px;color:#a79e90}
  .en a{color:var(--accent);font-weight:600}
</style>
</head>
<body>
  <div class="logo"><a href="/"><b>TLNT</b></a></div>
  <main>
    <div class="box">
      <div class="emblem">
        <div class="circle"></div>
        <div class="sp s1">✦</div>
        <div class="sp s2">✦</div>
        <div class="n">404</div>
      </div>
      <h1>Кажется, такой страницы <em>нет</em></h1>
      <p>Возможно, она переехала или в адресе закралась опечатка. Ничего страшного — давайте вернёмся к началу 🤍</p>
      <div class="btns">
        <a class="btn" href="/">На главную</a>
        <a class="btn soft" href="/#niches">Все направления</a>
      </div>
      <p style="margin:26px auto 0;font-size:15px;color:#8a8175;max-width:380px">Что-то не нашлось? <a href="https://wa.me/971585783353?text=%D0%94%D0%BE%D0%B1%D1%80%D1%8B%D0%B9%20%D0%B4%D0%B5%D0%BD%D1%8C%2C%20" style="color:var(--accent);font-weight:600">Напишите нам</a> — спокойно подскажем, куда смотреть 🤍</p>
      <div class="en">Page not found. <a href="/">Back to homepage →</a></div>
    </div>
  </main>
  <script src="/widget.js"></script>
</body>
</html>
